<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Post Creation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #d4af37;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        button {
            background: #d4af37;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        button:hover {
            background: #b8860b;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <h1>Test Post Creation API</h1>
    
    <div class="form-group">
        <label>Admin Token (from localStorage):</label>
        <input type="text" id="token" placeholder="Paste your admin token here">
        <button onclick="getTokenFromStorage()">Get from localStorage</button>
    </div>

    <div class="form-group">
        <label>Title:</label>
        <input type="text" id="title" value="Test Post Title">
    </div>

    <div class="form-group">
        <label>Content:</label>
        <textarea id="content" rows="4">This is test content for the blog post.</textarea>
    </div>

    <div class="form-group">
        <label>Slug:</label>
        <input type="text" id="slug" value="test-post-title">
    </div>

    <div class="form-group">
        <label>Status:</label>
        <select id="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
        </select>
    </div>

    <div class="form-group">
        <label>Category ID (optional):</label>
        <input type="number" id="category_id" value="">
    </div>

    <div class="form-group">
        <label>Author ID:</label>
        <input type="number" id="author_id" value="1">
    </div>

    <div class="form-group">
        <label>Tag IDs (JSON array):</label>
        <input type="text" id="tag_ids" value="[]" placeholder='[1, 2, 3]'>
    </div>

    <div class="form-group">
        <label>FAQs (JSON array):</label>
        <textarea id="faqs" rows="3">[{"question":"Test question?","answer":"Test answer"}]</textarea>
    </div>

    <div class="form-group">
        <label>Article Sections (JSON array):</label>
        <textarea id="article_sections" rows="3">[{"heading":"Test Heading","content":"Test content"}]</textarea>
    </div>

    <button onclick="testPostCreation()">Create Post</button>
    <button onclick="clearResult()">Clear Result</button>

    <div id="result"></div>

    <script>
        function getTokenFromStorage() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                document.getElementById('token').value = token;
                showResult('Token loaded from localStorage', 'success');
            } else {
                showResult('No token found in localStorage', 'error');
            }
        }

        function showResult(message, type = '') {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = type;
        }

        async function testPostCreation() {
            const token = document.getElementById('token').value;
            
            if (!token) {
                showResult('Please provide an admin token', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('content', document.getElementById('content').value);
            formData.append('slug', document.getElementById('slug').value);
            formData.append('status', document.getElementById('status').value);
            formData.append('author_id', document.getElementById('author_id').value);
            
            const categoryId = document.getElementById('category_id').value;
            if (categoryId) {
                formData.append('category_id', categoryId);
            }

            formData.append('tag_ids', document.getElementById('tag_ids').value);
            formData.append('faqs', document.getElementById('faqs').value);
            formData.append('article_sections', document.getElementById('article_sections').value);

            showResult('Sending request...', '');

            try {
                const response = await fetch('http://localhost:5000/api/posts', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                const result = `
Status: ${response.status} ${response.statusText}

Response:
${JSON.stringify(data, null, 2)}
                `;

                showResult(result, response.ok ? 'success' : 'error');

            } catch (error) {
                showResult(`Error: ${error.message}`, 'error');
            }
        }

        function clearResult() {
            document.getElementById('result').textContent = '';
        }

        // Auto-load token on page load
        window.onload = function() {
            getTokenFromStorage();
        };
    </script>
</body>
</html>
